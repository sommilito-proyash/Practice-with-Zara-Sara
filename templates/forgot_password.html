{% extends 'base.html' %}{% block title %}Password Recovery{% endblock %}{% block content %}<div class="auth"><div class="card auth-card"><h1>🔐 Password Reset</h1><p class="muted">Student ID, মোবাইল ও Recovery PIN দিয়ে নতুন password সেট করো।</p><form method="post"><label>Student ID<input name="username" required></label><label>মোবাইল<input name="phone" inputmode="tel" required></label><label>Recovery PIN<input name="recovery_pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>নতুন Password<input type="password" name="new_password" minlength="6" required></label><label>নতুন Password আবার লিখুন<input type="password" name="confirm_password" minlength="6" required></label><button class="btn primary fullbtn">Password Reset</button></form><div class="auth-links"><a href="{{url_for('forgot_id')}}">Student ID খুঁজে নাও</a><a href="{{url_for('login')}}">লগইন</a></div></div></div>{% endblock %}
