{% extends 'base.html' %}{% block title %}{{game.title}}{% endblock %}{% block content %}<div class="wrap section game-page"><div class="section-title"><div><span class="pill">🎮 Game Zone</span><h1>{{game.title}}</h1><p class="lead">{{game.description or 'খেলা ও শেখার মজার অনুশীলন।'}}</p></div><a class="btn" href="{{url_for('games')}}">← গেম লিস্ট</a></div><div id="gameRoot" class="card game-stage" data-kind="{{game_config.get('kind','')}}"><div id="gameIntro" class="game-intro"><div class="big">🎯</div><h2>প্রস্তুত তো?</h2><p>একটি স্তর বেছে নিয়ে শুরু করো।</p><div class="game-controls"><label>স্তর<select id="level"><option value="easy">সহজ</option><option value="medium" selected>মাঝারি</option><option value="hard">কঠিন</option></select></label><button class="btn primary" id="startBtn">▶️ শুরু</button></div></div><div id="gameBody" hidden></div></div></div><script>
const kind=document.getElementById('gameRoot').dataset.kind||'';const body=document.getElementById('gameBody'),intro=document.getElementById('gameIntro'),startBtn=document.getElementById('startBtn'),levelSel=document.getElementById('level');let timer=null;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function begin(title,html,setup){intro.hidden=true;body.hidden=false;body.innerHTML=`<div class="section-title"><div><h2>${title}</h2><p class="muted">স্তর: ${levelSel.options[levelSel.selectedIndex].text}</p></div><div class="game-score">স্কোর: <b id="score">0</b></div></div>${html}`;setup&&setup()}
function finish(message){clearInterval(timer);document.querySelectorAll('.game-choice,.memory-card,#check,#wordCheck').forEach(x=>x.disabled=true);body.insertAdjacentHTML('beforeend',`<div class="game-finish notice"><h2>🎉 ${message}</h2><p>তোমার স্কোর: <b>${document.getElementById('score')?.textContent||0}</b></p><button class="btn primary" onclick="location.reload()">আবার খেলি</button></div>`)}
function quickMath(){let score=0,seconds={easy:45,medium:35,hard:25}[levelSel.value];begin('দ্রুত গণিত',`<div class="mini-progress">সময়: <b id="time">${seconds}</b> সেকেন্ড</div><div id="mathQ" class="game-question"></div><div class="game-input"><input id="ans" inputmode="numeric" autocomplete="off" placeholder="উত্তর লিখো"><button class="btn primary" id="check">চেক</button></div>`,()=>{let a=0;function next(){let max=levelSel.value==='easy'?10:levelSel.value==='medium'?25:60,x=Math.floor(Math.random()*max)+1,y=Math.floor(Math.random()*max)+1,op=levelSel.value==='hard'?['+','-','×'][Math.floor(Math.random()*3)]:['+','×'][Math.floor(Math.random()*2)];if(op==='-'&&y>x)[x,y]=[y,x];a=op==='+'?x+y:op==='-'?x-y:x*y;document.getElementById('mathQ').textContent=`${x} ${op} ${y} = ?`;document.getElementById('ans').value='';document.getElementById('ans').focus()}document.getElementById('check').onclick=()=>{if(Number(document.getElementById('ans').value)===a){score++;document.getElementById('score').textContent=score}next()};document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('check').click()});next();timer=setInterval(()=>{seconds--;document.getElementById('time').textContent=seconds;if(seconds<=0)finish('সময় শেষ!')},1000)})}
function numberPattern(){let score=0,i=0,total=8;begin('সংখ্যা রহস্য',`<div id="patternQ" class="game-question"></div><div class="pattern-options" id="patternOpts"></div>`,()=>{function next(){if(i>=total)return finish('চমৎকার!');i++;const start=Math.floor(Math.random()*8)+1,step=Math.floor(Math.random()*(levelSel.value==='hard'?9:5))+2,seq=[start,start+step,start+2*step,start+3*step];const correct=seq[3];seq.pop();const opts=shuffle([correct,correct+step,Math.max(1,correct-step),correct+2*step]);document.getElementById('patternQ').innerHTML=`ধারা: <b>${seq.join(' , ')} , ?</b>`;document.getElementById('patternOpts').innerHTML=opts.map(v=>`<button class="game-choice" data-v="${v}">${v}</button>`).join('');document.querySelectorAll('.game-choice').forEach(b=>b.onclick=()=>{if(Number(b.dataset.v)===correct){score++;document.getElementById('score').textContent=score}next()})}next()})}
function memoryMatch(){let score=0,pairs=levelSel.value==='easy'?4:levelSel.value==='medium'?6:8;begin('স্মৃতি মিল',`<div class="memory-grid" id="memory"></div><p class="muted">দুটি একই কার্ড খুঁজে মিলাও।</p>`,()=>{const icons=['📚','➗','🔬','🌍','⭐','🧠','🌸','🚀','🐟','🧩','✏️','🎯'],values=shuffle(icons.slice(0,pairs).flatMap(x=>[x,x]));let flipped=[],matched=0;document.getElementById('memory').innerHTML=values.map((v,i)=>`<button class="memory-card" data-i="${i}"><span>${v}</span></button>`).join('');document.querySelectorAll('.memory-card').forEach(btn=>btn.onclick=()=>{if(btn.disabled||flipped.length===2||btn.classList.contains('open'))return;btn.classList.add('open');flipped.push(btn);if(flipped.length===2){if(values[Number(flipped[0].dataset.i)]===values[Number(flipped[1].dataset.i)]){matched+=2;score++;document.getElementById('score').textContent=score;flipped.forEach(x=>x.disabled=true);flipped=[];if(matched===values.length)finish('সব জোড়া মিলেছে!')}else setTimeout(()=>{flipped.forEach(x=>x.classList.remove('open'));flipped=[]},650)}})})}
function wordScramble(){const words=levelSel.value==='easy'?['apple','school','water','book','green','learn']:levelSel.value==='medium'?['science','student','picture','number','planet','future']:['knowledge','education','challenge','mathematics','discovery','experiment'];let score=0,idx=0;begin('শব্দ সাজাও',`<div id="wordQ" class="game-question"></div><div class="game-input"><input id="wordAns" autocomplete="off" placeholder="সঠিক শব্দ লিখো"><button class="btn primary" id="wordCheck">চেক</button></div>`,()=>{function next(){if(idx>=words.length)return finish('সব শব্দ শেষ!');const word=words[idx++];let scrambled=shuffle(word.split('')).join('');while(scrambled===word)scrambled=shuffle(word.split('')).join('');document.getElementById('wordQ').innerHTML=`অক্ষরগুলো সাজাও: <b>${scrambled}</b>`;document.getElementById('wordAns').value='';document.getElementById('wordAns').focus();document.getElementById('wordCheck').onclick=()=>{if(document.getElementById('wordAns').value.trim().toLowerCase()===word){score++;document.getElementById('score').textContent=score}next()}}next()})}
function quickGK(){const qs=[['বাংলাদেশের জাতীয় ফুল কোনটি?',['শাপলা','গোলাপ','জবা','বেলি'],0],['সূর্য কোন ধরনের জ্যোতিষ্ক?',['গ্রহ','নক্ষত্র','উপগ্রহ','ধূমকেতু'],1],['পৃথিবীর উপগ্রহ কোনটি?',['মঙ্গল','চাঁদ','শুক্র','বৃহস্পতি'],1],['বাংলাদেশের রাজধানী কোনটি?',['চট্টগ্রাম','রাজশাহী','ঢাকা','খুলনা'],2],['পানি জমে কী হয়?',['বাষ্প','বরফ','বৃষ্টি','মেঘ'],1],['৭ দিনে কত দিন?',['৫','৬','৭','৮'],2],['জাতীয় কবি কে?',['রবীন্দ্রনাথ ঠাকুর','কাজী নজরুল ইসলাম','জসীমউদ্দীন','সুকান্ত'],1],['মানুষ শ্বাসে প্রধানত কোন গ্যাস নেয়?',['অক্সিজেন','কার্বন ডাই-অক্সাইড','হিলিয়াম','হাইড্রোজেন'],0]];let score=0,idx=0;begin('দ্রুত সাধারণ জ্ঞান',`<div id="gkQ" class="game-question"></div><div id="gkOpts" class="pattern-options"></div>`,()=>{function next(){if(idx>=qs.length)return finish('GK challenge শেষ!');const q=qs[idx++];document.getElementById('gkQ').innerHTML=q[0];document.getElementById('gkOpts').innerHTML=q[1].map((v,i)=>`<button class="game-choice" data-i="${i}">${v}</button>`).join('');document.querySelectorAll('.game-choice').forEach(b=>b.onclick=()=>{if(Number(b.dataset.i)===q[2]){score++;document.getElementById('score').textContent=score}next()})}next()})}
startBtn.onclick=()=>({quick_math:quickMath,number_pattern:numberPattern,memory_match:memoryMatch,word_scramble:wordScramble,quick_gk:quickGK}[kind]||quickMath)();
</script>{% endblock %}
