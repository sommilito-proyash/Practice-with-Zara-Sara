{% extends 'base.html' %}{% block title %}Home Page Content{% endblock %}{% block content %}<div class="wrap section"><div class="adminhead"><div><h1>🏠 Home Page Content</h1><p>হোম পেজের লেখা ও প্রধান ছবি পরিবর্তন করুন</p></div><a class="btn" href="{{url_for('admin')}}">← Dashboard</a></div><form method="post" class="card formgrid"><label>Site Name<input name="site_name" value="{{settings.site_name or ''}}" required></label><label>Tagline<input name="tagline" value="{{settings.tagline or ''}}"></label><label class="full">Purpose<textarea name="purpose">{{settings.purpose or ''}}</textarea></label><label class="full">About<textarea name="about">{{settings.about or ''}}</textarea></label><label>Hero Title<input name="hero_title" value="{{settings.hero_title or ''}}"></label><label>Hero Subtitle<input name="hero_subtitle" value="{{settings.hero_subtitle or ''}}"></label><label>Logo URL<input type="url" name="logo_url" value="{{settings.logo_url or ''}}" placeholder="https://..."></label><label>Hero Image URL<input type="url" name="hero_image_url" value="{{settings.hero_image_url or ''}}" placeholder="https://..."></label><label class="full">Background Image URL<input type="url" name="background_url" value="{{settings.background_url or ''}}" placeholder="https://..."></label><label class="full">Facebook URL<input type="url" name="facebook_url" value="{{settings.facebook_url or ''}}" placeholder="https://facebook.com/..."></label><div class="full actions"><button class="btn primary">সংরক্ষণ করুন</button><a class="btn" href="{{url_for('admin_images')}}">Image Manager</a></div></form></div>{% endblock %}
