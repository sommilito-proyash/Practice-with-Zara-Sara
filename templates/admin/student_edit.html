{% extends 'base.html' %}{% block title %}Student Edit{% endblock %}{% block content %}<div class="wrap section"><div class="adminhead"><div><h1>✏️ Student Edit</h1><p>Student ID <b>{{student.username}}</b> পরিবর্তন না করে profile তথ্য ও access নিয়ন্ত্রণ করুন।</p></div><a class="btn" href="{{url_for('admin_students')}}">← Students</a></div><form method="post" class="card formgrid"><label>Display Name<input name="display_name" value="{{student.display_name or ''}}" required></label><label>Registered Class<select name="class_id"><option value="">নির্ধারিত নয়</option>{% for c in classes %}<option value="{{c.id}}" {% if student.class_id|string==c.id|string %}selected{% endif %}>{{c.name}}{% if c.stage %} — {{c.stage}}{% endif %}</option>{% endfor %}</select></label><label>Practice Class<select name="practice_class_id"><option value="">Registered Class অনুযায়ী</option>{% for c in classes %}<option value="{{c.id}}" {% if student.practice_class_id|string==c.id|string %}selected{% endif %}>{{c.name}}{% if c.stage %} — {{c.stage}}{% endif %}</option>{% endfor %}</select></label><label>মোবাইল<input name="phone" value="{{student.phone or ''}}"></label><label>Email<input type="email" name="email" value="{{student.email or ''}}"></label><label>Recovery PIN <span class="muted">(ফাঁকা রাখলে অপরিবর্তিত)</span><input name="recovery_pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"></label><label class="checkline"><input type="checkbox" name="active" value="1" {% if student.active %}checked{% endif %}> Active account</label><div class="full actions"><button class="btn primary">তথ্য সংরক্ষণ</button><a class="btn" href="{{url_for('admin_students')}}">বাতিল</a></div></form><div class="card section-card"><h2>🔐 Password Reset</h2><form method="post" action="{{url_for('admin_student_reset_password',sid=student.id)}}" class="compact-form"><label>নতুন Password<input type="password" name="new_password" minlength="6" required></label><button class="btn primary">Reset Password</button></form></div></div>{% endblock %}
