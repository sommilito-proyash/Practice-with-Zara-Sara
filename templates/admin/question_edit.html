{% extends 'base.html' %}{% block title %}Edit Question{% endblock %}{% block content %}<div class="wrap section"><div class="adminhead"><div><h1>✏️ প্রশ্ন সম্পাদনা</h1><p>Class, Subject, Chapter, options, explanation ও difficulty পরিবর্তন করুন।</p></div><a class="btn" href="{{url_for('admin_questions')}}">← Question Bank</a></div><form method="post" class="card formgrid"><label>Class<select name="class_id" id="editQuestionClass"><option value="">সব শ্রেণি</option>{% for c in classes %}<option value="{{c.id}}" {% if question.class_id and question.class_id|string==c.id|string %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Subject<select name="subject_id" id="editQuestionSubject">{% for s in subjects %}<option value="{{s.id}}" {% if question.subject_id|string==s.id|string %}selected{% endif %}>{{s.icon}} {{s.name}}</option>{% endfor %}</select></label><label>Existing Chapter<select name="chapter_id" id="editQuestionChapter"><option value="">Chapter নির্বাচন করুন</option>{% for ch in chapters %}<option value="{{ch.id}}" {% if question.chapter_id|string==ch.id|string %}selected{% endif %}>{{ch.title}}</option>{% endfor %}</select></label><label>New Chapter <span class="muted">(ঐচ্ছিক)</span><input name="new_chapter" placeholder="নতুন Chapter হলে লিখুন"></label><label>Difficulty<select name="difficulty"><option value="easy" {% if question.difficulty=='easy' %}selected{% endif %}>Easy</option><option value="medium" {% if question.difficulty=='medium' %}selected{% endif %}>Medium</option><option value="hard" {% if question.difficulty=='hard' %}selected{% endif %}>Hard</option></select></label><label>Marks<input type="number" name="marks" min="1" value="{{question.marks or 1}}"></label><label class="full">Question<textarea name="question_text" required>{{question.question_text}}</textarea></label>{% for i in range(4) %}<label>Option {{i+1}}<input name="opt{{i}}" value="{{options[i].option_text if options|length > i else ''}}" required></label>{% endfor %}<label>Correct Option<select name="correct">{% for i in range(4) %}<option value="{{i}}" {% if options|length>i and options[i].is_correct %}selected{% endif %}>Option {{i+1}}</option>{% endfor %}</select></label><label class="full">Explanation<textarea name="explanation">{{question.explanation or ''}}</textarea></label><div class="full actions"><button class="btn primary">পরিবর্তন সংরক্ষণ</button><a class="btn" href="{{url_for('admin_questions')}}">বাতিল</a></div></form></div><script>async function editLoadChapters(){const cls=document.getElementById('editQuestionClass').value,sid=document.getElementById('editQuestionSubject').value,target=document.getElementById('editQuestionChapter');const keep='{{question.chapter_id or ""}}';const res=await fetch('{{url_for('api_chapters')}}?class_id='+encodeURIComponent(cls)+'&subject_id='+encodeURIComponent(sid));const data=await res.json();target.innerHTML='<option value="">Chapter নির্বাচন করুন</option>'+data.chapters.map(c=>`<option value="${c.id}" ${String(c.id)===String(keep)?'selected':''}>${c.title}</option>`).join('');}document.getElementById('editQuestionClass').addEventListener('change',editLoadChapters);document.getElementById('editQuestionSubject').addEventListener('change',editLoadChapters);</script>{% endblock %}
